[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
hashbrown = { version = "0.17", default-features = false }
md-5 = "0.11"
rustc-hash = "2"
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
libimage = { package = "scivolo-libimage", path = "crates/libimage" }
libs = { package = "scivolo-libs", path = "crates/libs" }
lower = { package = "scivolo-lower", path = "crates/lower" }
macros = { package = "scivolo-macros", path = "crates/macros" }
nir = { package = "scivolo-nir", path = "crates/nir" }
repl = { package = "scivolo-repl", path = "crates/repl" }
snrt = { package = "scivolo-snrt", path = "crates/snrt" }
syntax = { package = "scivolo-syntax", path = "crates/syntax" }
tasty = { package = "scivolo-tasty", path = "crates/tasty" }
typer = { package = "scivolo-typer", path = "crates/typer" }
vm = { package = "scivolo-vm", path = "crates/vm" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev.package.scivolo-vm]
opt-level = 2

[profile.dev.package.scivolo-nir]
opt-level = 2

[profile.dev.package.scivolo-aot]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.release]
debug = "line-tables-only"
