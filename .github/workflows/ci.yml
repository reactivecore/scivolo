name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Job steps are thin: every command lives in the Justfile. Tool versions follow ci/Dockerfile.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            coursier-cache: ~/.cache/coursier
          - os: macos-26
            coursier-cache: ~/Library/Caches/Coursier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends clang zlib1g-dev bc

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal -c rustfmt,clippy
          rustup default 1.99.1

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - uses: coursier/setup-action@v3
        with:
          version: 2.1.26
          apps: ""

      - uses: Swatinem/rust-cache@v2

      - name: Cache library jars
        uses: actions/cache@v6
        with:
          path: ref/libs
          key: libs-${{ hashFiles('scripts/fetch-libs.sh') }}

      - name: Cache library image and Coursier downloads
        uses: actions/cache@v6
        with:
          path: |
            tmp/cache
            ${{ matrix.coursier-cache }}
          key: runtime-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: runtime-${{ matrix.os }}-

      - name: Versions
        run: rustc --version && cargo --version && just --version && clang --version && cs version

      - name: Build and test
        run: just ci
