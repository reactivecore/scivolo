name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Job steps are thin: every command lives in the Justfile, the tools in .github/actions/setup.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            coursier-cache: ~/.cache/coursier
          - os: macos-26
            coursier-cache: ~/Library/Caches/Coursier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Cache library image and Coursier downloads
        uses: actions/cache@v6
        with:
          path: |
            tmp/cache
            ${{ matrix.coursier-cache }}
          key: runtime-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: runtime-${{ matrix.os }}-

      - name: Build and test
        run: just ci
