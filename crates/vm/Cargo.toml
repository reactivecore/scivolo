[package]
name = "scivolo-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "vm"

[features]
# Runs without the C runtime, `mmap`, coroutines and OS threads, as on wasm32 (ADR 0127).
portable = []

[dependencies]
nir.workspace = true
libimage.workspace = true
rustc-hash.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
snrt.workspace = true
libc = "0.2"
corosensei = "0.3"

[lints]
workspace = true
