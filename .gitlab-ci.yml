workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/
    - when: never

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  # Test builds without debuginfo; caches zipped by fastzip at its fastest level.
  CARGO_PROFILE_DEV_DEBUG: "0"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  CI_IMAGE: $CI_REGISTRY_IMAGE/builder:$BUILDER_TAG
  SUITE_IMAGE: $CI_REGISTRY_IMAGE/suite:$BUILDER_TAG

# Job scripts are thin: every command lives in the Justfile.
stages:
  - prepare
  - test

# Builds each target of ci/Dockerfile into <target>:sha-<hash of the Dockerfile> unless the
# registry has it.
build-image:
  stage: prepare
  interruptible: true
  image:
    name: quay.io/containers/aio:latest
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: docker
    REGISTRY_AUTH_FILE: /tmp/auth.json
  script:
    - HASH=$(sha256sum ci/Dockerfile | cut -c1-12)
    - export BUILDER_TAG="sha-${HASH}"
    - echo "BUILDER_TAG=${BUILDER_TAG}" > builder_tag.env
    - cat builder_tag.env
    - mkdir -p /etc/containers/registries.conf.d
    - echo 'short-name-mode = "permissive"' > /etc/containers/registries.conf.d/00-shortnames.conf
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      if skopeo inspect "docker://${CI_REGISTRY_IMAGE}/builder:${BUILDER_TAG}" >/dev/null &&
         skopeo inspect "docker://${CI_REGISTRY_IMAGE}/suite:${BUILDER_TAG}" >/dev/null; then
        echo "Images already exist — skipping build."
        exit 0
      fi
      for target in builder suite; do
        image="${CI_REGISTRY_IMAGE}/${target}:${BUILDER_TAG}"
        buildah bud --layers -f ci/Dockerfile --target "$target" -t "$image" "$CI_PROJECT_DIR"
        buildah push "$image"
      done
  artifacts:
    reports:
      dotenv: builder_tag.env

.cargo_cache_paths: &cargo_cache_paths
  - .cargo/registry/index
  - .cargo/registry/cache

# The library jars and the library image built from them.
.libs_cache_paths: &libs_cache_paths
  - ref/libs
  - tmp/cache

.not_scheduled: &not_scheduled
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

# Pushes its caches on main only; merge requests pull them.
test:linux:
  image: ${CI_IMAGE}
  stage: test
  interruptible: true
  rules:
    - *not_scheduled
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    - when: on_success
      variables:
        CACHE_POLICY: pull
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scivolo-cargo-linux
      paths: *cargo_cache_paths
      policy: $CACHE_POLICY
    - key:
        prefix: scivolo-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: $CACHE_POLICY
    - key: scivolo-libs-linux
      paths: *libs_cache_paths
      policy: $CACHE_POLICY
    - key: scivolo-coursier-linux
      paths: [.cache/coursier]
      policy: $CACHE_POLICY
  script:
    - rustc --version && cargo --version && just --version && clang --version && cs version
    - cargo nextest --version && nproc
    - just ci

# Scala Native's unit tests: on main, and on demand in a merge request.
.suite:
  stage: test
  interruptible: false
  timeout: 4h
  rules:
    - *not_scheduled
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - when: on_success
  artifacts:
    when: always
    paths: [tmp/sn-report/]
    expire_in: 4 weeks

suite:linux:
  extends: .suite
  image: ${SUITE_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scivolo-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scivolo-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    - key: scivolo-suite-linux
      paths: [.cache/coursier, ref/libs]
  script:
    - rustc --version && clang --version && java -version && scala-cli version --cli-version
    - just ci-suite

# The committed NIR of the test programs (and their .check files) and of the library overlay
# against a rebuild: in a merge request that touches them (only the programs it changes), and
# in scheduled pipelines (all).
nir-stale:
  stage: test
  interruptible: true
  image: ${SUITE_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scivolo-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scivolo-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    # The cache of suite:linux, pulled and pushed.
    - key: scivolo-suite-linux
      paths: [.cache/coursier, ref/libs]
  artifacts:
    when: on_failure
    paths: [tmp/programs/*/out/, tmp/overlay/out/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [tests/programs/**/*, overlay/**/*, scripts/programs.py, scripts/overlay.py, ci/Dockerfile, Justfile]
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - scala-cli version --cli-version
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch --quiet origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || true
        just programs-stale-since "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        just programs-stale
      fi
    - just overlay-stale

# The library compiled by the own frontend against Scala Native's build with Scala 3.9.0, the
# unit tests on its jars and the test programs linked against them (`just ci-lib`): in scheduled
# pipelines, and on demand in a merge request that touches the library scripts. The oracle is
# cached per version of lib-oracle.sh and of the Scala Native checkout.
lib:linux:
  stage: test
  interruptible: false
  timeout: 4h
  image: ${SUITE_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [scripts/lib-*, scripts/native_modules.py, scripts/sn-report-compare.py, tests/lib/**/*, ci/Dockerfile, Justfile]
      when: manual
      allow_failure: true
  cache:
    - key: scivolo-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scivolo-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    - key: scivolo-suite-linux
      paths: [.cache/coursier, ref/libs]
      policy: pull
    - key:
        prefix: scivolo-lib-oracle
        files: [scripts/lib-oracle.sh, scripts/fetch-scala-native.sh]
      paths: [tmp/lib/sn]
      when: always
  artifacts:
    when: always
    paths:
      - tmp/lib/*/results.tsv
      - tmp/lib/*/refusals.txt
      - tmp/lib/*/oracle-only.txt
      - tmp/lib/*/diffs/
      - tmp/sn-report/
      - tmp/sn-report-ours/
      - tmp/lib-link/*/results.tsv
      - tmp/lib-link/*/logs/
    expire_in: 4 weeks
  script:
    - java -version && sbt --script-version && scala-cli version --cli-version && coursier --version
    - just ci-lib

# The runner provides a JDK; scala-cli comes from scripts/fetch-scala-cli.sh.
suite:macos:
  extends: .suite
  tags: [ "macos" ]
  needs: []
  cache:
    - key: scivolo-suite-macos
      paths: [ref/libs, tmp/tools]
  script:
    - scripts/fetch-scala-cli.sh
    - export PATH="$CI_PROJECT_DIR/tmp/tools/scala-cli-1.14.0:$PATH"
    - rustc --version && clang --version && java -version && scala-cli version --cli-version
    - just ci-suite

# The relocatable distribution (`just dist`), checked from a copy: on main, on release tags and
# in pipelines run by hand or by trigger.
.dist:
  stage: test
  interruptible: true
  rules:
    - *not_scheduled
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script:
    - just dist dist-check
  artifacts:
    paths: [tmp/dist/*.tar.gz]
    expire_in: 4 weeks

dist:linux:
  extends: .dist
  image: ${CI_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scivolo-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scivolo-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    - key: scivolo-libs-linux
      paths: *libs_cache_paths
      policy: pull

dist:macos:
  extends: .dist
  tags: [ "macos" ]
  needs: []
  cache:
    - key: scivolo-cargo-macos
      paths: *cargo_cache_paths
      policy: pull
    - key: scivolo-libs-macos
      paths: *libs_cache_paths
      policy: pull

# Native shell runner: `image:` is ignored, the runner provides rustup and `just`, and it
# keeps target/ between pipelines.
test:macos:
  stage: test
  interruptible: true
  tags: [ "macos" ]
  needs: []
  rules:
    - *not_scheduled
    - when: on_success
  cache:
    - key: scivolo-cargo-macos
      paths: *cargo_cache_paths
    - key: scivolo-libs-macos
      paths: *libs_cache_paths
  script:
    - rustc --version && cargo --version && just --version && clang --version && node --version
    - just ci
