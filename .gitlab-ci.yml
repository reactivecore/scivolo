workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  CI_IMAGE: $CI_REGISTRY_IMAGE/builder:$BUILDER_TAG
  SUITE_IMAGE: $CI_REGISTRY_IMAGE/suite:$BUILDER_TAG

# Job scripts are thin: every command lives in the Justfile.
stages:
  - prepare
  - test

# Builds each target of ci/Dockerfile into <target>:sha-<hash of the Dockerfile> unless the
# registry has it.
build-image:
  stage: prepare
  interruptible: true
  image:
    name: quay.io/containers/aio:latest
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: docker
    REGISTRY_AUTH_FILE: /tmp/auth.json
  script:
    - HASH=$(sha256sum ci/Dockerfile | cut -c1-12)
    - export BUILDER_TAG="sha-${HASH}"
    - echo "BUILDER_TAG=${BUILDER_TAG}" > builder_tag.env
    - cat builder_tag.env
    - mkdir -p /etc/containers/registries.conf.d
    - echo 'short-name-mode = "permissive"' > /etc/containers/registries.conf.d/00-shortnames.conf
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      if skopeo inspect "docker://${CI_REGISTRY_IMAGE}/builder:${BUILDER_TAG}" >/dev/null &&
         skopeo inspect "docker://${CI_REGISTRY_IMAGE}/suite:${BUILDER_TAG}" >/dev/null; then
        echo "Images already exist — skipping build."
        exit 0
      fi
      for target in builder suite; do
        image="${CI_REGISTRY_IMAGE}/${target}:${BUILDER_TAG}"
        buildah bud --layers -f ci/Dockerfile --target "$target" -t "$image" "$CI_PROJECT_DIR"
        buildah push "$image"
      done
  artifacts:
    reports:
      dotenv: builder_tag.env

.cargo_cache_paths: &cargo_cache_paths
  - .cargo/registry/index
  - .cargo/registry/cache

# The library jars and the library image built from them.
.libs_cache_paths: &libs_cache_paths
  - ref/libs
  - tmp/cache

.not_scheduled: &not_scheduled
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

test:linux:
  image: ${CI_IMAGE}
  stage: test
  interruptible: true
  rules:
    - *not_scheduled
    - when: on_success
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scalai-cargo-linux
      paths: *cargo_cache_paths
    - key:
        prefix: scalai-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
    - key: scalai-libs-linux
      paths: *libs_cache_paths
    - key: scalai-coursier-linux
      paths: [.cache/coursier]
  script:
    - rustc --version && cargo --version && just --version && clang --version && cs version
    - just ci

# Scala Native's unit tests: on main, and on demand in a merge request.
.suite:
  stage: test
  interruptible: false
  timeout: 4h
  rules:
    - *not_scheduled
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - when: on_success
  artifacts:
    when: always
    paths: [tmp/sn-report/]
    expire_in: 4 weeks

suite:linux:
  extends: .suite
  image: ${SUITE_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scalai-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scalai-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    - key: scalai-suite-linux
      paths: [.cache/coursier, ref/libs]
  script:
    - rustc --version && clang --version && java -version && scala-cli version --cli-version
    - just ci-suite

# The committed NIR of the test programs (and their .check files) and of the library overlay
# against a rebuild: in a merge request that touches them (only the programs it changes), and
# in scheduled pipelines (all).
nir-stale:
  stage: test
  interruptible: true
  image: ${SUITE_IMAGE}
  needs:
    - job: build-image
      artifacts: true
  variables:
    XDG_CACHE_HOME: ${CI_PROJECT_DIR}/.cache
  cache:
    - key: scalai-cargo-linux
      paths: *cargo_cache_paths
      policy: pull
    - key:
        prefix: scalai-target-linux
        files: [Cargo.lock, ci/Dockerfile]
      paths: [target]
      policy: pull
    - key: scalai-suite-linux
      paths: [.cache/coursier]
      policy: pull
  artifacts:
    when: on_failure
    paths: [tmp/programs/*/out/, tmp/overlay/out/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [tests/programs/**/*, overlay/**/*, scripts/programs.py, scripts/overlay.py, ci/Dockerfile, Justfile]
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - scala-cli version --cli-version
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch --quiet origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || true
        just programs-stale-since "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        just programs-stale
      fi
    - just overlay-stale

# The runner provides a JDK; scala-cli comes from scripts/fetch-scala-cli.sh.
suite:macos:
  extends: .suite
  tags: [ "macos" ]
  needs: []
  cache:
    - key: scalai-suite-macos
      paths: [ref/libs, tmp/tools]
  script:
    - scripts/fetch-scala-cli.sh
    - export PATH="$CI_PROJECT_DIR/tmp/tools/scala-cli-1.14.0:$PATH"
    - rustc --version && clang --version && java -version && scala-cli version --cli-version
    - just ci-suite

# Native shell runner: `image:` is ignored, the runner provides rustup and `just`, and it
# keeps target/ between pipelines.
test:macos:
  stage: test
  interruptible: true
  tags: [ "macos" ]
  needs: []
  rules:
    - *not_scheduled
    - when: on_success
  cache:
    - key: scalai-cargo-macos
      paths: *cargo_cache_paths
    - key: scalai-libs-macos
      paths: *libs_cache_paths
  script:
    - rustc --version && cargo --version && just --version && clang --version
    - just ci
